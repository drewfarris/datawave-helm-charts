apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "queries.name" . }}
{{- if .Values.prerequisites.requireIngestionJob }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "queries.name" . }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "queries.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "queries.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "queries.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
