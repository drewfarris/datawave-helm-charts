apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "examples.name" . }}-runner
  labels:
    {{- include "examples.labels" . | nindent 4 }}
data:
  check-existing-cache.sh: |
    {{- .Files.Get "files/check-existing-cache.sh" | nindent 4 }}
  run-examples.sh: |
    {{- .Files.Get "files/run-examples.sh" | nindent 4 }}
