
{{- define "datawave.datawaveInstallScript" -}}
#!/bin/bash -e
{{- if .Values.startupReadyFile }}
set -Eeo pipefail
trap 'echo "[ERROR] Ingest startup failed at line $LINENO" >&2' ERR
source /cmds/ingest-passwd.sh
{{- end }}
DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
cd $DIR

echo "Creating logs directory and opening permissions"
mkdir -p /srv/logs/ingest
chmod 777 -R /srv/logs/

# Copy only these files; other config entries are read-only ConfigMap mounts.
for config in /opt/datawave-ingest/mounted-config/*; do
  target="/opt/datawave-ingest/current/config/$(basename "$config")"
  [[ ! -e "$target" ]] || chmod u+w "$target"
  cp -L "$config" "$target"
  chmod u-w "$target"
done

echo "Create Accumulo Namespace"
if ! /opt/accumulo/bin/accumulo shell -u root -p {{ if .Values.startupReadyFile }}"$PASSWORD"{{ else }}{{ .Values.config.accumuloPassword | quote }}{{ end }} -e namespaces | grep -Eq '^[[:space:]]*datawave([[:space:]]|$)'; then
  /opt/accumulo/bin/accumulo shell -u root -p {{ if .Values.startupReadyFile }}"$PASSWORD"{{ else }}{{ .Values.config.accumuloPassword | quote }}{{ end }} -e "createnamespace datawave"
fi

echo "Set Classpath Context"
/opt/accumulo/bin/accumulo shell -u root -p {{ if .Values.startupReadyFile }}"$PASSWORD"{{ else }}{{ .Values.config.accumuloPassword | quote }}{{ end }} -e "config -s  table.class.loader.context=datawave"

echo "resetting hadoop home to use mounted config"
export HADOOP_CONF_DIR=/usr/local/hadoop/conf/

echo "Symlinking Password file"
ln -s /cmds/ingest-passwd.sh /opt/datawave-ingest/ingest-passwd.sh

echo "Creating Flag File directory and making it owned by datawave"
mkdir -p /srv/data/datawave/flags

{{ .Values.config.initIngestScript }}
{{- if (.Values.config.sharedConfig).claim }}
  echo "synchronizing shared config to pvc {{ .Values.config.sharedConfig.claim }} at {{ .Values.config.sharedConfig.path }}"
  cp -Lr /opt/datawave-ingest/current/config/* {{ .Values.config.sharedConfig.path }}
{{- end }}


{{- if .Values.startupReadyFile }}
touch {{ .Values.startupReadyFile | quote }}
{{- end }}
tail -f /dev/null


{{- end -}}


{{- define "datawave.passwdfile" -}}
#TODO update to pass passwords in as secrets.
{{ .Values.config.ingestPasswd | nindent 4 }}

{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datawave.fullname" . }}-cmds
  labels:
    {{- include "datawave.labels" . | nindent 4 }}
type: Opaque
data:
  run.sh: {{ include "datawave.datawaveInstallScript" . | b64enc }}
  ingest-passwd.sh: {{ include "datawave.passwdfile" . | b64enc }}