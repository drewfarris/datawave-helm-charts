{{- if and .Values.ingress.enabled (ne .Values.role "writer") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.meta.name }}-ingress"
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - host: "{{ .Values.ingress.annotation.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.meta.name }}"
                port:
                  number: {{ .Values.ports.https }}
{{- end }}
