# helm upgrade --install annotation-api ./annotation -f annotation/examples/api-values.yaml
role: api
meta:
  name: annotation-api
replication:
  replicaCount: 3
ingress:
  enabled: true
# The chart activates annotation-api; annotation-annotation-api.yml selects annotation.role=api.
# Both pools keep spring.application.name=annotation and use the same messaging destinations.
# The API overlay disables direct file fallback for broker-only acceptance by default.
# Override only with persistent per-replica fallback storage and replay operations.
