# helm upgrade --install annotation-api ./annotation -f annotation/examples/api-values.yaml
role: api
meta:
  name: annotation-api
replication:
  replicaCount: 3
ingress:
  enabled: true
# The chart supplies ANNOTATION_ROLE; shared Config Server configuration leaves annotation.role unset.
# Both pools keep spring.application.name=annotation and use the same messaging destinations.
# Disable annotation.writers.file.enabled in API configuration for broker-only write acceptance,
# or provide persistent per-replica file fallback storage and replay operations.
