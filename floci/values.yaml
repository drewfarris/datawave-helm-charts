# Local Minikube defaults. Persistent PVC is retained on Helm uninstall.
image:
  repository: docker.io/floci/floci
  tag: 2.3.0
  digest: sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
  pullPolicy: IfNotPresent
service:
  port: 4566
region: us-east-1
existingSecret: floci-aws-credentials
persistence:
  size: 10Gi
  storageClass: floci-local
  createStorageClass: true
nodeSelector:
  kubernetes.io/hostname: minikube-m03
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi
nativeHeap:
  initial: 32m
  maximum: 192m
