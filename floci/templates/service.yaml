apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: floci
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: aws
      port: {{ .Values.service.port }}
      targetPort: aws
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: floci
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: aws
      port: {{ .Values.service.port }}
      targetPort: aws
