{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap-{{ .Values.bootstrap.runId }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floci-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: bootstrap
          image: "{{ .Values.probeImage.repository }}:{{ .Values.probeImage.tag }}"
          imagePullPolicy: {{ .Values.probeImage.pullPolicy }}
          args: [/probes/s3_probe.py, bootstrap]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.region | quote }}
            - name: AWS_ENDPOINT_URL
              value: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: BUCKETS
              value: {{ join "," .Values.bootstrap.buckets | quote }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: probes
              mountPath: /probes
              readOnly: true
      volumes:
        - name: probes
          configMap:
            name: {{ .Release.Name }}-probes
{{- end }}
