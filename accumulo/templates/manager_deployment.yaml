apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "accumulo.fullname" . }}-manager
  labels:
    {{- include "accumulo.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  replicas: {{ .Values.manager.replicaCount }}
  selector:
    matchLabels:
      {{- include "accumulo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      annotations:
        checksum/accumulo-config: {{ include (print $.Template.BasePath "/site-config.yaml") $ | sha256sum }}
        {{- if .Values.hybridStorage.enabled }}
        checksum/hybrid-bootstrap: {{ include (print $.Template.BasePath "/hybrid-bootstrap.yaml") $ | sha256sum }}
        {{- end }}
      labels:
        {{- include "accumulo.labels" . | nindent 8 }}
        app.kubernetes.io/component: manager
    spec:
      hostNetwork: {{ coalesce .Values.hostNetwork.ma .Values.hostNetwork.default false }}
      securityContext:
        runAsUser: 1001
      initContainers:
      - name: init-hdfs-nn
        securityContext:
          runAsUser: 1000
        image: busybox:1.28
        command: ['sh', '-c', "until nslookup {{ .Values.hdfs.namenode.hostname }}; do echo waiting for hdfs; sleep 2; done"]
      - name: check-hadoop-jars
        image: "{{ .Values.initContainer.image }}:{{ .Values.initContainer.tag }}"
        imagePullPolicy: {{ .Values.initContainer.pullPolicy }}
        env:
        - name: HADOOP_CLASSPATH
          value: {{ .Values.hadoop.classpath | quote }}
        securityContext:
          runAsUser: 1000
        command: 
        - "/bin/sh"
        args: ["-c", "while [ `hdfs dfs -ls hdfs://{{ .Values.global.hdfs.namenode }}/datawave/accumulo-vfs-classpath | wc -l` -lt 5 ]; do echo \"Waiting for jars to load\"; sleep 10; done"]
      {{- if .Values.hybridStorage.enabled }}
      - name: initialize-hybrid-storage
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["bash", "/hybrid-bootstrap/bootstrap.sh"]
        env:
        {{- with $.Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: ACCUMULO_INSTANCE_NAME
          value: {{ .Values.global.accumulo.instanceName | quote }}
        - name: ACCUMULO_ROOT_PASSWORD
          value: {{ .Values.config.userManagement.rootPassword | quote }}
        - name: BOOTSTRAP_ZOOKEEPERS
          value: {{ .Values.global.accumulo.zookeepers | quote }}
        - name: BOOTSTRAP_HDFS
          value: {{ required "hybridStorage.hdfsVolume is required" .Values.hybridStorage.hdfsVolume | quote }}
        - name: BOOTSTRAP_S3
          value: {{ required "hybridStorage.s3Volume is required" .Values.hybridStorage.s3Volume | quote }}
        - name: HADOOP_CONF_DIR
          value: {{ .Values.global.volumes.hadoop.destination | quote }}
        - name: HADOOP_CLASSPATH
          value: {{ .Values.hadoop.classpath | quote }}
        - name: ACCUMULO_JAVA_OPTS
          value: -Xmx256m -Xms64m
        volumeMounts:
        {{- with $.Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: source-accumulo
          mountPath: /source-accumulo
          readOnly: true
        {{- include "accumulo.volumeMount" $.Values.global.volumes.hadoop | nindent 8 }}
        - name: hybrid-bootstrap
          mountPath: /hybrid-bootstrap
          readOnly: true
        - name: bootstrap-work
          mountPath: /bootstrap-work
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 768Mi}
      {{- end }}
      hostname: accumulo-manager
      containers:
      - name: accumulo-manager
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/bin/bash", "-c"]
        args: ["./entrypoint.sh accumulo manager -a $(hostname -f)" ]
        ports:
          - containerPort: 9999
        env:
        {{- with $.Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: HADOOP_CONF_DIR
          value: {{ $.Values.global.volumes.hadoop.destination }}
        - name: ACCUMULO_CONF_DIR
          value: {{ $.Values.global.volumes.accumulo.destination }}
        - name: ACCUMULO_INSTANCE_NAME
          value: {{ .Values.global.accumulo.instanceName }}
        - name: HADOOP_CLASSPATH
          value: {{ .Values.hadoop.classpath }}
        - name: ACCUMULO_ROOT_PASSWORD
          value: {{ .Values.config.userManagement.rootPassword }}
        volumeMounts:
          {{- with $.Values.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- include "accumulo.volumeMount" $.Values.global.volumes.hadoop | nindent 10 }}
          {{- include "accumulo.volumeMount" $.Values.global.volumes.accumulo | nindent 10 }}
          - name: cmds
            mountPath: /cmds
            readOnly: true
          - name: entrypoint
            mountPath: /entrypoint.sh
            subPath: entrypoint.sh
        resources:
          {{- toYaml .Values.manager.resources | nindent 10 }}
      volumes:
        {{- if .Values.hybridStorage.enabled }}
        - name: hybrid-bootstrap
          configMap:
            name: {{ include "accumulo.fullname" . }}-hybrid-bootstrap
        - name: source-accumulo
          configMap:
            name: {{ .Values.global.volumes.accumulo.source.name }}
        - name: bootstrap-work
          emptyDir: {}
        {{- end }}
        {{- with $.Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: entrypoint
          configMap:
            name: {{ .Values.entrypointConfigMap.name }}
            defaultMode: 0777
        {{- include "accumulo.volume" $.Values.global.volumes.hadoop | nindent 8 }}
        {{- include "accumulo.volume" $.Values.global.volumes.accumulo | nindent 8 }}
        - name: cmds
          secret:
            secretName: {{ include "accumulo.fullname" . }}-cmds
            optional: false
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.pullSecrets }}
      imagePullSecrets:
      {{- range . }}
      - name: {{ . }}
      {{- end }}
      {{- end }}
